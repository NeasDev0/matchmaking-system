services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db_matchmaking
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  authservice:
    build: ./authservice
    container_name: authservice
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres_db:5432/userdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /app/authservice/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/authservice/keys/public.pem
    depends_on:
      - postgres_db
      - redis
    volumes:
      - ./authservice:/app/authservice

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://authservice:8001
    depends_on:
      - redis
      - authservice
    volumes:
      - ./gateway:/app/gateway

  node_manager:
    build: ./game_container
    container_name: node_manager
    environment:
      MASTER_SERVER_URL: http://gateway:8000 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gateway

volumes:
  postgres_data: